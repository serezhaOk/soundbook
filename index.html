<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2ea" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎵</text></svg>" />
  <title>Soundfall — прототип</title>
  <script type="module" crossorigin src="/soundbook/assets/index-DLNS4D3k.js"></script>
  <link rel="stylesheet" crossorigin href="/soundbook/assets/index-D-Yl6vTa.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- гобо: медленно плывущие диагональные тени, как свет через окно -->
  <div id="gobo" aria-hidden="true"></div>

  <div id="start-screen">
    <img class="scr scr-star" src="/soundbook/assets/star-CtA4Sact.svg" alt="" />
    <img class="scr scr-green" src="/soundbook/assets/squiggle-green-CK-ZeYLV.svg" alt="" />
    <img class="scr scr-yellow" src="/soundbook/assets/zigzag-yellow-_8BvUqXg.svg" alt="" />
    <img class="scr scr-blue" src="/soundbook/assets/ellipse-blue-DHzoHd2c.svg" alt="" />

    <div class="book-wrap" id="book">
      <div class="book-shadow"></div>
      <div class="book">
        <div class="page"></div>
        <div class="cover">
          <img class="bk-title" src="/soundbook/assets/book-title-DEKj_uS2.svg" alt="Sound Book" />
          <img class="bk-cta" src="/soundbook/assets/book-cta-C49_DaKp.svg" alt="Tap to Open" />
        </div>
        <div class="spine"></div>
      </div>
    </div>
  </div>

  <!-- Слайдер количества генераций эмиттера — пока закомментирован
  <div class="tempo-row">
    <input type="range" id="tempo" min="30" max="480" step="1" value="120" />
    <span id="bpmLabel" class="mono">120</span>
  </div>
  -->

  <div id="ui">
    <button id="eraserBtn" class="eraser" title="Ластик" aria-label="Ластик">
      <span class="er-tip"></span>
      <span class="er-body"></span>
      <span class="er-collar"></span>
    </button>

    <div class="pill" id="palette">
      <button class="swatch" data-color="5" style="--c:#f58f8b" title="Сплиттер"></button>
      <button class="swatch" data-color="1" style="--c:#c9a3ed" title="Желе"></button>
      <button class="swatch active" data-color="3" style="--c:#83c9ed" title="Центрифуга"></button>
      <button class="swatch" data-color="4" style="--c:#a7e29b" title="Арпеджиатор"></button>
      <button class="swatch" data-color="2" style="--c:#f6ce5c" title="Батут"></button>
    </div>

    <button id="playBtn" class="play" title="Пауза / старт" aria-label="Пауза / старт">
      <svg class="ic-pause" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <rect x="7" y="5" width="3.6" height="14" rx="1.6" fill="#fff" />
        <rect x="13.4" y="5" width="3.6" height="14" rx="1.6" fill="#fff" />
      </svg>
      <svg class="ic-play" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display:none">
        <path d="M9 7.5 L9 16.5 L16.8 12 Z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

</body>
</html>
