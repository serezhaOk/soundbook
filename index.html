<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2ea" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎵</text></svg>" />
  <title>Soundfall — прототип</title>
  <script type="module" crossorigin src="/soundbook/assets/index-CwbWgnip.js"></script>
  <link rel="stylesheet" crossorigin href="/soundbook/assets/index-J2dou1rF.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="start-screen">
    <div class="logo">
      <span class="dot"></span>
      <h1>Soundfall</h1>
    </div>
    <p>физический секвенсор-водопад</p>
    <button id="startBtn">tap to start</button>
  </div>

  <div id="ui">
    <div class="tempo-row">
      <input type="range" id="tempo" min="30" max="480" step="1" value="120" />
      <span id="bpmLabel" class="mono">120</span>
    </div>
    <div class="main-row">
      <button id="eraserBtn" class="eraser" title="Ластик">
        <span class="eraser-tip"></span><span class="eraser-body"></span>
      </button>
      <div class="pill">
        <div class="palette" id="palette">
          <button class="swatch active" data-color="1" style="--c:#cfa9f0" title="Желе"></button>
          <button class="swatch" data-color="2" style="--c:#f2dd8a" title="Батут + реверб"></button>
          <button class="swatch" data-color="3" style="--c:#8fd8f0" title="Центрифуга + delay"></button>
          <button class="swatch" data-color="4" style="--c:#a3e69d" title="Арпеджиатор"></button>
          <button class="swatch" data-color="5" style="--c:#f7b3c8" title="Сплиттер"></button>
        </div>
        <button id="clearBtn" title="Очистить всё">✕</button>
      </div>
      <button id="playBtn" class="play" title="Пауза / старт">⏸</button>
    </div>
  </div>

</body>
</html>
